name: projeto_encontros_aplicativo_web
description: "Frontend Flutter Web/PWA do Juntô."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  intl: ^0.19.0
  file_picker: 11.0.2
  image_picker: 1.2.0
  geolocator: 13.0.4
  url_launcher: ^6.3.2
  flutter_map: 8.2.2
  latlong2: ^0.9.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/imagens/fundo_da_entrada.png
    - assets/imagens/logo_junto.png
