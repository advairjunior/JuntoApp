<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Organize encontros e guarde as melhores memórias do seu grupo.">
  <meta name="theme-color" content="#050D0B">
  <meta name="color-scheme" content="dark">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Juntô">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=junto-20260715">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-junto.png?v=junto-20260715">
  <link rel="shortcut icon" type="image/png" href="favicon-junto.png?v=junto-20260715">

  <title>Juntô</title>
  <link rel="manifest" href="manifest.json?v=junto-20260715">
</head>
<body style="margin: 0; background: #050D0B;">
  <script>
    let conviteDeInstalacaoDoJunto = null;

    window.addEventListener('beforeinstallprompt', (evento) => {
      evento.preventDefault();
      conviteDeInstalacaoDoJunto = evento;
    });

    window.addEventListener('appinstalled', () => {
      conviteDeInstalacaoDoJunto = null;
    });

    window.juntoEstaInstalado = () =>
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    window.juntoPodeInstalar = () => conviteDeInstalacaoDoJunto !== null;

    window.juntoEhIos = () =>
      /iphone|ipad|ipod/i.test(window.navigator.userAgent);

    window.juntoSoliciteInstalacao = async () => {
      if (conviteDeInstalacaoDoJunto === null) {
        return false;
      }

      conviteDeInstalacaoDoJunto.prompt();
      const escolha = await conviteDeInstalacaoDoJunto.userChoice;
      conviteDeInstalacaoDoJunto = null;
      return escolha.outcome === 'accepted';
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
